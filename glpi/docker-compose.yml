# GLPI on SRV-UBUNTU1 (10.10.20.10), port 8080 (Nginx already uses 80).
# The .env file (database credentials) is generated on the server and never committed:
#   GLPI_DB_HOST=db  GLPI_DB_PORT=3306  GLPI_DB_NAME=glpi  GLPI_DB_USER=glpi
#   GLPI_DB_PASSWORD=<random, openssl rand -hex 24>     (chmod 600 .env)
services:
  glpi:
    image: glpi/glpi:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - glpi_data:/var/glpi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 12
volumes:
  glpi_data:
  db_data:
